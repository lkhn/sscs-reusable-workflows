# This workflow is managed by gh actions-lock.

name: Release container with key signing

permissions: {}

on:
  workflow_call:
    secrets:
      sigstore_private_key:
        description: "Sigstore private key"
        required: true
      sigstore_private_key_password:
        description: "Password of Sigstore private key"
        required: true

env:
  CONTAINER_REGISTRY: ghcr.io
  CONTAINER_REPOSITORY: lkhn/sigstore-playground
  CONTAINER_IMAGE: zig-key
  COSIGN_VERSION: v3.1.3

jobs:
  build:
    name: Build
    permissions:
      packages: write # Permits to push container images to GHCR.
    runs-on: ubuntu-26.04
    outputs:
      image_manifest_digest: ${{ steps.image_manifest_remote.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build blob
        id: blob
        run: |
          zig_mirror=$(curl -fsSL https://ziglang.org/download/community-mirrors.txt | shuf -n 1)
          zig_version=$(curl -fsSL https://ziglang.org/download/index.json | jq -r '.master.version')
          zig_tarball_x86_64_linux_master="zig-x86_64-linux-${zig_version}.tar.xz"
          curl -fsSL "${zig_mirror}/${zig_tarball_x86_64_linux_master}" -o "$zig_tarball_x86_64_linux_master"
          printf '%s=%s\n' 'zig_tarball' "$zig_tarball_x86_64_linux_master" >> "$GITHUB_OUTPUT"

      - name: Build container image
        id: image
        env:
          ARTIFACT: ${{ steps.blob.outputs.zig_tarball }}
        run: |
          buildah unshare ./zig_container.sh "$ARTIFACT"
          image_id=$(<image_id.txt)
          printf '%s=%s\n' 'id' "$image_id" >> "$GITHUB_OUTPUT"

      - name: Create a image manifest
        id: image_manifest_local
        env:
          MANIFEST_NAME: zig
        run: |
          image_manifest_local_imageid=$(buildah manifest create \
              --annotation \
              "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
              "${CONTAINER_REPOSITORY}:${MANIFEST_NAME}")
          printf '%s=%s\n' 'id' "$image_manifest_local_imageid" >> "$GITHUB_OUTPUT"

      - name: Add image into image manifest
        env:
          IMAGE_MANIFEST_ID: ${{ steps.image_manifest_local.outputs.id }}
          IMAGE_ID: ${{ steps.image.outputs.id }}
        run: |
          buildah manifest add "$IMAGE_MANIFEST_ID" "$IMAGE_ID"
          buildah images # DEBUG: List images and image manifests
          buildah manifest inspect "$IMAGE_MANIFEST_ID" # DEBUG: Inspect image manifest

      # GitHub-hosted runners already have a ${HOME}/.docker/config.json with a credential which has unlimited pull rate and limit on Docker Hub.
      # Append the new credential to the same file and tell buildah and its friends (podman, skopeo etc.) to use it.
      - name: Login to container registry
        env:
          CONTAINER_REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CONTAINER_REGISTRY_USER: ${{ github.actor }}
        run: |
          printf '%s' "$CONTAINER_REGISTRY_TOKEN" | docker login "$CONTAINER_REGISTRY" -u "$CONTAINER_REGISTRY_USER" --password-stdin
          printf '%s=%s\n' 'REGISTRY_AUTH_FILE' "${HOME}/.docker/config.json" >> "$GITHUB_ENV"

      - name: Push image manifest to container registry
        id: image_manifest_remote
        env:
          IMAGE_MANIFEST_ID: ${{ steps.image_manifest_local.outputs.id }}
          VERSION: ${{ github.ref_name }}
        run: |
          buildah manifest push \
              --digestfile image_manifest_remote_digest.txt \
              "$IMAGE_MANIFEST_ID" \
              "docker://${CONTAINER_REGISTRY}/${CONTAINER_REPOSITORY}/${CONTAINER_IMAGE}:${VERSION##*/}"
          image_manifest_remote_digest=$(<image_manifest_remote_digest.txt)
          printf '%s=%s\n' 'digest' "$image_manifest_remote_digest" >> "$GITHUB_OUTPUT"

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          upload-artifact: false
          upload-release-assets: false
          image: ${{ env.CONTAINER_REGISTRY }}/${{ env.CONTAINER_REPOSITORY }}/${{ env.CONTAINER_IMAGE }}@${{ steps.image_manifest_remote.outputs.digest }}
          format: spdx-json@2.3
          output-file: zig-key.spdx.json

      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          upload-artifact: false
          upload-release-assets: false
          image: ${{ env.CONTAINER_REGISTRY }}/${{ env.CONTAINER_REPOSITORY }}/${{ env.CONTAINER_IMAGE }}@${{ steps.image_manifest_remote.outputs.digest }}
          format: cyclonedx-json@1.6
          output-file: zig-key.cyclonedx.json

      # - name: Push image manifest into latest tag too
      #   env:
      #     IMAGE_MANIFEST_ID: ${{ steps.image_manifest_local.outputs.id }}
      #   run: |
      #     buildah manifest push \
      #         "$IMAGE_MANIFEST_ID" \
      #         "docker://${CONTAINER_REGISTRY}/${CONTAINER_REPOSITORY}/${CONTAINER_IMAGE}:latest"

      - name: Logout from container registry
        if: ${{ always() }}
        run: docker logout "$CONTAINER_REGISTRY" || true

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: error
          path: |
            zig-key.spdx.json
            zig-key.cyclonedx.json

  sign:
    name: Sign
    permissions:
      packages: write # Permits to push container images to GHCR.
    needs:
      - build
    runs-on: ubuntu-26.04
    env:
      CONTAINER_IMAGE_DIGEST: ${{ needs.build.outputs.image_manifest_digest }}
    steps:
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}

      - name: Login to container registry
        env:
          CONTAINER_REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CONTAINER_REGISTRY_USER: ${{ github.actor }}
        run: |
          printf '%s' "$CONTAINER_REGISTRY_TOKEN" | docker login "$CONTAINER_REGISTRY" -u "$CONTAINER_REGISTRY_USER" --password-stdin
          printf '%s=%s\n' 'REGISTRY_AUTH_FILE' "${HOME}/.docker/config.json" >> "$GITHUB_ENV"

      - name: Sign image manifest on container registry
        env:
          SIGSTORE_PRIVATE_KEY: ${{ secrets.sigstore_private_key }}
          COSIGN_PASSWORD: ${{ secrets.sigstore_private_key_password }}
        run: |
          cosign sign \
              --key env://SIGSTORE_PRIVATE_KEY \
              --recursive \
              --yes \
              "${CONTAINER_REGISTRY}/${CONTAINER_REPOSITORY}/${CONTAINER_IMAGE}@${CONTAINER_IMAGE_DIGEST}"

      - name: Logout from container registry
        if: ${{ always() }}
        run: docker logout "$CONTAINER_REGISTRY" || true

  attest:
    name: Attest
    permissions:
      id-token: write # Permits to use OpenID Connect (OIDC) token to sign artifact attestation.
      attestations: write # Permits to generate an artifact attestation.
      artifact-metadata: write # Permits to create the artifact storage record.
      packages: write # Permits to push container images to GHCR.
    needs:
      - build
      - sign
    runs-on: ubuntu-26.04
    outputs:
      slsa_provenance_attestation_url: ${{ steps.slsa_provenance.outputs.attestation-url }}
    env:
      CONTAINER_IMAGE_DIGEST: ${{ needs.build.outputs.image_manifest_digest }}
    steps:
      - name: Login to container registry
        env:
          CONTAINER_REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CONTAINER_REGISTRY_USER: ${{ github.actor }}
        run: |
          printf '%s' "$CONTAINER_REGISTRY_TOKEN" | docker login "$CONTAINER_REGISTRY" -u "$CONTAINER_REGISTRY_USER" --password-stdin
          printf '%s=%s\n' 'REGISTRY_AUTH_FILE' "${HOME}/.docker/config.json" >> "$GITHUB_ENV"

      - name: Generate SLSA build provenance attestation
        id: slsa_provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.CONTAINER_REGISTRY }}/${{ env.CONTAINER_REPOSITORY }}/${{ env.CONTAINER_IMAGE }}
          subject-digest: ${{ needs.build.outputs.image_manifest_digest }}
          push-to-registry: false # Cosign will do key based attestation on container registry.

      - name: Download Build Artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}

      - name: Extract SLSA build predicate from Sigstore bundle
        env:
          SLSA_SIGSTORE_BUNDLE: ${{ steps.slsa_provenance.outputs.bundle-path }}
        run: |
          jq -r '.dsseEnvelope.payload | @base64d | fromjson | .predicate' "$SLSA_SIGSTORE_BUNDLE" > slsa_build_predicate.json
          jq '.' slsa_build_predicate.json

      - name: Attest SLSA build provenance
        env:
          SIGSTORE_PRIVATE_KEY: ${{ secrets.sigstore_private_key }}
          COSIGN_PASSWORD: ${{ secrets.sigstore_private_key_password }}
        run: |
          cosign attest \
              --key env://SIGSTORE_PRIVATE_KEY \
              --predicate slsa_build_predicate.json \
              --type slsaprovenance1 \
              --yes \
              "${CONTAINER_REGISTRY}/${CONTAINER_REPOSITORY}/${CONTAINER_IMAGE}@${CONTAINER_IMAGE_DIGEST}"

      - name: Attest SPDX SBOM
        env:
          SIGSTORE_PRIVATE_KEY: ${{ secrets.sigstore_private_key }}
          COSIGN_PASSWORD: ${{ secrets.sigstore_private_key_password }}
        run: |
          cosign attest \
              --key env://SIGSTORE_PRIVATE_KEY \
              --predicate zig-key.spdx.json \
              --type spdxjson \
              --yes \
              "${CONTAINER_REGISTRY}/${CONTAINER_REPOSITORY}/${CONTAINER_IMAGE}@${CONTAINER_IMAGE_DIGEST}"

      - name: Attest CycloneDX SBOM
        env:
          SIGSTORE_PRIVATE_KEY: ${{ secrets.sigstore_private_key }}
          COSIGN_PASSWORD: ${{ secrets.sigstore_private_key_password }}
        run: |
          cosign attest \
              --key env://SIGSTORE_PRIVATE_KEY \
              --predicate zig-key.cyclonedx.json \
              --type cyclonedx \
              --yes \
              "${CONTAINER_REGISTRY}/${CONTAINER_REPOSITORY}/${CONTAINER_IMAGE}@${CONTAINER_IMAGE_DIGEST}"

      - name: Logout from container registry
        if: ${{ always() }}
        run: docker logout "$CONTAINER_REGISTRY" || true

  verify:
    name: Verify
    needs:
      - build
      - sign
      - attest
    runs-on: ubuntu-26.04
    env:
      CONTAINER_IMAGE_DIGEST: ${{ needs.build.outputs.image_manifest_digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}

      - name: Show supply chain artifacts of image
        run: |
          cosign tree "${CONTAINER_REGISTRY}/${CONTAINER_REPOSITORY}/${CONTAINER_IMAGE}@${CONTAINER_IMAGE_DIGEST}"

      - name: Verify image manifest with public key
        run: |
          cosign verify \
              --key sigstore.pub \
              "${CONTAINER_REGISTRY}/${CONTAINER_REPOSITORY}/${CONTAINER_IMAGE}@${CONTAINER_IMAGE_DIGEST}"

      - name: Offline Verify image manifest with public key
        run: |
          cosign verify \
              --key sigstore.pub \
              --insecure-ignore-tlog \
              "${CONTAINER_REGISTRY}/${CONTAINER_REPOSITORY}/${CONTAINER_IMAGE}@${CONTAINER_IMAGE_DIGEST}"

      - name: Verify SPDX SBOM attestation
        run: |
          cosign verify-attestation \
              --key sigstore.pub \
              --type spdxjson \
              --output-file cosign_verify_attestation_sbom_spdx_output.json \
              "${CONTAINER_REGISTRY}/${CONTAINER_REPOSITORY}/${CONTAINER_IMAGE}@${CONTAINER_IMAGE_DIGEST}"

      - name: Verify CycloneDX SBOM attestation
        run: |
          cosign verify-attestation \
              --key sigstore.pub \
              --type cyclonedx \
              --output-file cosign_verify_attestation_sbom_cyclonedx_output.json \
              "${CONTAINER_REGISTRY}/${CONTAINER_REPOSITORY}/${CONTAINER_IMAGE}@${CONTAINER_IMAGE_DIGEST}"

      - name: Verify SLSA build provenance attestation
        run: |
          cosign verify-attestation \
              --key sigstore.pub \
              --type slsaprovenance1 \
              --output-file cosign_verify_attestation_slsaprovenance_output.json \
              "${CONTAINER_REGISTRY}/${CONTAINER_REPOSITORY}/${CONTAINER_IMAGE}@${CONTAINER_IMAGE_DIGEST}"

      - name: Verify SLSA build provenance with strict policy
        run: |
          cosign verify-attestation \
              --key sigstore.pub \
              --type slsaprovenance1 \
              --policy policies/policy_key.cue \
              "${CONTAINER_REGISTRY}/${CONTAINER_REPOSITORY}/${CONTAINER_IMAGE}@${CONTAINER_IMAGE_DIGEST}"

      - name: Verify SLSA build provenance with loose policy
        run: |
          cosign verify-attestation \
              --key sigstore.pub \
              --type slsaprovenance1 \
              --policy policies/policy_loose_key.cue \
              "${CONTAINER_REGISTRY}/${CONTAINER_REPOSITORY}/${CONTAINER_IMAGE}@${CONTAINER_IMAGE_DIGEST}"

      - name: Verify SLSA build provenance with wrong policy
        run: |
          cosign verify-attestation \
              --key sigstore.pub \
              --type slsaprovenance1 \
              --policy policies/policy_wrong_key.cue \
              "${CONTAINER_REGISTRY}/${CONTAINER_REPOSITORY}/${CONTAINER_IMAGE}@${CONTAINER_IMAGE_DIGEST}" \
          || true

      - name: Extract SPDX SBOM from attestation
        run: jq -r '.payload | @base64d | fromjson | .predicate' cosign_verify_attestation_sbom_spdx_output.json

      - name: Extract CycloneDX SBOM from attestation
        run: jq -r '.payload | @base64d | fromjson | .predicate' cosign_verify_attestation_sbom_cyclonedx_output.json

      - name: Extract SLSA build provenance from attestation
        run: jq -r '.payload | @base64d | fromjson | .predicate' cosign_verify_attestation_slsaprovenance_output.json

      - name: Verify SLSA build provenance on Artifacts Attestation.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_FORCE_TTY: true
          REUSABLE_GITHUB_REPOSITORY: ${{ job.workflow_repository }}
        run: |
          gh attestation verify \
              --repo "$GITHUB_REPOSITORY" \
              --signer-repo "$REUSABLE_GITHUB_REPOSITORY" \
              --format json \
              "oci://${CONTAINER_REGISTRY}/${CONTAINER_REPOSITORY}/${CONTAINER_IMAGE}@${CONTAINER_IMAGE_DIGEST}"

  release:
    name: Release
    permissions:
      contents: write # Permits to create a release.
    needs:
      - build
      - sign
      - attest
      - verify
    runs-on: ubuntu-26.04
    env:
      VERSION: ${{ github.ref_name }}
      CONTAINER_IMAGE_DIGEST: ${{ needs.build.outputs.image_manifest_digest }}
      SLSA_PROVENANCE_ATTESTATION_URL: ${{ needs.attest.outputs.slsa_provenance_attestation_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Write release notes with transparency logs
        run: |
          cat > release_notes.md <<EOF
          - **Workflow Run:** ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          - **Attestation of SLSA build provenance:** $SLSA_PROVENANCE_ATTESTATION_URL
          - **Container Image Digest:**
          \`\`\`
          ${CONTAINER_REGISTRY}/${CONTAINER_REPOSITORY}/${CONTAINER_IMAGE}@${CONTAINER_IMAGE_DIGEST}
          \`\`\`
          - **Container Image Tag:**
          \`\`\`
          ${CONTAINER_REGISTRY}/${CONTAINER_REPOSITORY}/${CONTAINER_IMAGE}@${VERSION##*/}
          \`\`\`
          EOF

      - name: Release a container image with Sigstore Bundle SBOM and SLSA provenance
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_TAG: ${{ github.ref_name }}
        run: |
          gh release create \
              "$GIT_TAG" \
              --verify-tag \
              --generate-notes \
              --notes-file release_notes.md \
              --title "Release of container images signed with keys $VERSION"
