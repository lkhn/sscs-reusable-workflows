# This workflow is managed by gh actions-lock.

name: Update Pre-commit Hooks

permissions: {}

on:
  schedule:
    - cron: "0 6 * * 1" # At 06:00 UTC on every Monday.
  workflow_dispatch:

jobs:
  update_and_run:
    name: Update and Run
    permissions:
      contents: write # Permits to push to repository.
      pull-requests: write # Permits to create pull requests.
      issues: write # Permits to create issues.
    runs-on: ubuntu-slim
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true # git push

      - name: Install prek
        uses: j178/prek-action@4e14d07f9231acabce116ccfca13b13dd9755ece # v3.0.0
        with:
          install-only: true

      - name: Check for hook updates
        id: pre_commit_hooks
        run: |
          set -x

          exit_code='0'
          prek update --verbose --exit-code || exit_code=$?
          if [ "$exit_code" = '1' ]; then
              printf '%s=%s\n' 'updated' 'true' >> "$GITHUB_OUTPUT"
              exit 0
          fi
          exit "$exit_code"

      - name: Run updated hooks
        id: pre_commit_run
        if: ${{ steps.pre_commit_hooks.outputs.updated }}
        continue-on-error: true
        run: prek run --all-files --show-diff-on-failure --verbose

      - name: Create PR if any hook is updated and runs without any issue
        if: ${{ steps.pre_commit_hooks.outputs.updated && steps.pre_commit_run.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git diff prek.toml
          git checkout -b ci/pre-commit/update
          git add prek.toml
          git commit -m 'chore(pre-commit): update hooks'
          git push --force origin ci/pre-commit/update
          gh pr create \
              --fill-verbose \
              --body "Created by: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
              --label 'pre-commit'

      - name: Create issue if any of updated hooks runs any issue
        if: ${{ steps.pre_commit_run.outcome == 'failure' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
              --title 'pre-commit: Hooks are failing after the update' \
              --body "Created by: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
              --label 'pre-commit'
