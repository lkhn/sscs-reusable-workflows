# This workflow is managed by gh actions-lock.

name: Release blob with key signing

permissions: {}

on:
  workflow_call:
    secrets:
      sigstore_private_key:
        description: "Sigstore private key"
        required: true
      sigstore_private_key_password:
        description: "Password of Sigstore private key"
        required: true

env:
  COSIGN_VERSION: v3.1.3

jobs:
  build:
    name: Build
    runs-on: ubuntu-26.04
    outputs:
      artifact: ${{ steps.blob.outputs.zig_tarball }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build
        id: blob
        run: |
          zig_mirror=$(curl -fsSL https://ziglang.org/download/community-mirrors.txt | shuf -n 1)
          zig_version=$(curl -fsSL https://ziglang.org/download/index.json | jq -r '.master.version')
          zig_tarball_x86_64_linux_master="zig-x86_64-linux-${zig_version}.tar.xz"
          curl -fsSL "${zig_mirror}/${zig_tarball_x86_64_linux_master}" -o "$zig_tarball_x86_64_linux_master"
          printf '%s=%s\n' 'zig_tarball' "$zig_tarball_x86_64_linux_master" >> "$GITHUB_OUTPUT"

      - name: Generate checksum
        env:
          ARTIFACT: ${{ steps.blob.outputs.zig_tarball }}
        run: sha256sum "$ARTIFACT" > "${ARTIFACT}.sha256sum"

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          upload-artifact: false
          upload-release-assets: false
          file: ${{ steps.blob.outputs.zig_tarball }}
          format: spdx-json@2.3
          output-file: ${{ steps.blob.outputs.zig_tarball }}.spdx.json

      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          upload-artifact: false
          upload-release-assets: false
          file: ${{ steps.blob.outputs.zig_tarball }}
          format: cyclonedx-json@1.6
          output-file: ${{ steps.blob.outputs.zig_tarball }}.cyclonedx.json

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: error
          path: |
            ${{ steps.blob.outputs.zig_tarball }}
            ${{ steps.blob.outputs.zig_tarball }}.spdx.json
            ${{ steps.blob.outputs.zig_tarball }}.cyclonedx.json
            ${{ steps.blob.outputs.zig_tarball }}.sha256sum

  sign:
    name: Sign
    needs:
      - build
    runs-on: ubuntu-26.04
    steps:
      - name: Download Build Artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}

      - name: Sign artifact
        env:
          ARTIFACT: ${{ needs.build.outputs.artifact }}
          SIGSTORE_PRIVATE_KEY: ${{ secrets.sigstore_private_key }}
          COSIGN_PASSWORD: ${{ secrets.sigstore_private_key_password }}
        run: |
          cosign sign-blob \
              --key env://SIGSTORE_PRIVATE_KEY \
              --bundle "${ARTIFACT}.sigstore.json" \
              --yes \
              "$ARTIFACT"

      # Offline signing.
      # - name: Create configuration for offline signing
      #   run: cosign signing-config create --out offline-signing-config.json

      # - name: Offline sign artifact
      #   env:
      #     ARTIFACT: ${{ needs.build.outputs.artifact }}
      #     SIGSTORE_PRIVATE_KEY: ${{ secrets.sigstore_private_key }}
      #     COSIGN_PASSWORD: ${{ secrets.sigstore_private_key_password }}
      #   run: |
      #     cosign sign-blob \
      #         --key env://SIGSTORE_PRIVATE_KEY \
      #         --bundle "${ARTIFACT}.sigstore.json" \
      #         --signing-config offline-signing-config.json \
      #         --yes \
      #         "$ARTIFACT"

      - name: Sign SPDX SBOM
        env:
          ARTIFACT: ${{ needs.build.outputs.artifact }}
          SIGSTORE_PRIVATE_KEY: ${{ secrets.sigstore_private_key }}
          COSIGN_PASSWORD: ${{ secrets.sigstore_private_key_password }}
        run: |
          cosign sign-blob \
              --key env://SIGSTORE_PRIVATE_KEY \
              --bundle "${ARTIFACT}.spdx.json.sigstore.json" \
              --yes \
              "${ARTIFACT}.spdx.json"

      - name: Sign CycloneDX SBOM
        env:
          ARTIFACT: ${{ needs.build.outputs.artifact }}
          SIGSTORE_PRIVATE_KEY: ${{ secrets.sigstore_private_key }}
          COSIGN_PASSWORD: ${{ secrets.sigstore_private_key_password }}
        run: |
          cosign sign-blob \
              --key env://SIGSTORE_PRIVATE_KEY \
              --bundle "${ARTIFACT}.cyclonedx.json.sigstore.json" \
              --yes \
              "${ARTIFACT}.cyclonedx.json"

      - name: Upload Signed Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: error
          overwrite: true
          path: |
            ${{ needs.build.outputs.artifact }}
            ${{ needs.build.outputs.artifact }}.sigstore.json
            ${{ needs.build.outputs.artifact }}.spdx.json
            ${{ needs.build.outputs.artifact }}.spdx.json.sigstore.json
            ${{ needs.build.outputs.artifact }}.cyclonedx.json
            ${{ needs.build.outputs.artifact }}.cyclonedx.json.sigstore.json
            ${{ needs.build.outputs.artifact }}.sha256sum

  attest:
    name: Attest
    permissions:
      id-token: write # Permits to use OpenID Connect (OIDC) token to sign artifact attestation.
      attestations: write # Permits to generate an artifact attestation.
      artifact-metadata: write # Permits to create the artifact storage record.
    needs:
      - build
      - sign
    runs-on: ubuntu-26.04
    outputs:
      slsa_provenance_attestation_url: ${{ steps.slsa_provenance.outputs.attestation-url }}
    steps:
      - name: Download signed artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1

      - name: Generate SLSA build provenance attestation
        id: slsa_provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            ${{ needs.build.outputs.artifact }}
            ${{ needs.build.outputs.artifact }}.spdx.json
            ${{ needs.build.outputs.artifact }}.cyclonedx.json

  verify:
    name: Verify
    needs:
      - build
      - sign
      - attest
    runs-on: ubuntu-26.04
    env:
      ARTIFACT: ${{ needs.build.outputs.artifact }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download signed artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}

      - name: Verify artifact
        run: |
          cosign verify-blob \
              --key sigstore.pub \
              --bundle "${ARTIFACT}.sigstore.json" \
              "$ARTIFACT"

      - name: Verify SPDX SBOM
        run: |
          cosign verify-blob \
              --key sigstore.pub \
              --bundle "${ARTIFACT}.spdx.json.sigstore.json" \
              "${ARTIFACT}.spdx.json"

      - name: Verify CycloneDX SBOM
        run: |
          cosign verify-blob \
              --key sigstore.pub \
              --bundle "${ARTIFACT}.cyclonedx.json.sigstore.json" \
              "${ARTIFACT}.cyclonedx.json"

      - name: Offline verify an artifact
        run: |
          cosign verify-blob \
              --key sigstore.pub \
              --bundle "${ARTIFACT}.sigstore.json" \
              --insecure-ignore-tlog \
              "$ARTIFACT"

      - name: Verify SLSA build provenance attestation of artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_FORCE_TTY: true
          SIGNER_REPO: ${{ job.workflow_repository }}
        run: |
          gh attestation verify \
              --repo "$GITHUB_REPOSITORY" \
              --signer-repo "$SIGNER_REPO" \
              --format json \
              "$ARTIFACT"

      - name: Verify SLSA build provenance attestation of SPDX SBOM
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_FORCE_TTY: true
          SIGNER_REPO: ${{ job.workflow_repository }}
        run: |
          gh attestation verify \
              --repo "$GITHUB_REPOSITORY" \
              --signer-repo "$SIGNER_REPO" \
              --format json \
              "${ARTIFACT}.spdx.json"

      - name: Verify SLSA build provenance attestation of CycloneDX SBOM
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_FORCE_TTY: true
          SIGNER_REPO: ${{ job.workflow_repository }}
        run: |
          gh attestation verify \
              --repo "$GITHUB_REPOSITORY" \
              --signer-repo "$SIGNER_REPO" \
              --format json \
              "${ARTIFACT}.cyclonedx.json"

  release:
    name: Release
    permissions:
      contents: write # Permits to create a release.
    needs:
      - build
      - sign
      - attest
      - verify
    runs-on: ubuntu-26.04
    env:
      ARTIFACT: ${{ needs.build.outputs.artifact }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download Build Artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1

      - name: Get transparency log entry of Signing event
        id: tlog
        run: |
          tlog_index=$(jq -r '.verificationMaterial.tlogEntries[].logIndex' \
              "${ARTIFACT}.sigstore.json")
          printf '%s=%s\n' 'index' "$tlog_index" >> "$GITHUB_OUTPUT"

      - name: Write release notes
        env:
          TLOG_SIGNING_INDEX: ${{ steps.tlog.outputs.index }}
          SLSA_PROVENANCE_ATTESTATION_URL: ${{ needs.attest.outputs.slsa_provenance_attestation_url }}
        run: |
          cat > release_notes.md <<EOF
          - **Workflow Run:** ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          - **Transparency log entry of Signing event:** https://search.sigstore.dev/?logIndex=${TLOG_SIGNING_INDEX}
          - **Attestation of SLSA build provenance:** $SLSA_PROVENANCE_ATTESTATION_URL
          EOF

      - name: Release artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_TAG: ${{ github.ref_name }}
        run: |
          gh release create \
              "$GIT_TAG" \
              --verify-tag \
              --generate-notes \
              --notes-file release_notes.md \
              --title "Release of blobs signed with keys $GIT_TAG" \
              "$ARTIFACT" \
              "${ARTIFACT}.sigstore.json" \
              "${ARTIFACT}.spdx.json" \
              "${ARTIFACT}.spdx.json.sigstore.json" \
              "${ARTIFACT}.cyclonedx.json" \
              "${ARTIFACT}.cyclonedx.json.sigstore.json" \
              "${ARTIFACT}.sha256sum"
